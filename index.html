
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamburger Cafe & Fast Food</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 background:#f4f5f7;
 color:#222;
 padding:15px;
}

.container{
 max-width:650px;
 margin:auto;
}

.header{
 background:#202b3c;
 color:white;
 padding:25px 18px;
 border-radius:15px;
 text-align:center;
 margin-bottom:18px;
}

.header h2{font-size:23px;margin-bottom:7px}
.header p{color:#ddd;font-size:13px}

.card{
 background:white;
 border-radius:13px;
 padding:18px;
 margin-bottom:15px;
 box-shadow:0 2px 10px #0000000b;
}

.date-row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 flex-wrap:wrap;
}

input,select{
 width:100%;
 padding:12px;
 border:1px solid #ddd;
 border-radius:8px;
 font-size:15px;
 margin-top:7px;
 outline:none;
}

label{
 font-size:14px;
 font-weight:bold;
}

.summary{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
 margin-top:15px;
}

.box{
 padding:16px 10px;
 border-radius:11px;
 background:#f4f6fa;
 text-align:center;
}

.box small{color:#666}
.box h2{margin-top:9px;font-size:22px}

.green{color:#16864b}
.red{color:#dc3545}
.blue{color:#1769aa}

.final{
 background:#e9f7ee;
 padding:20px;
 text-align:center;
 border-radius:12px;
 margin-top:14px;
}

.final h1{
 color:#16864b;
 font-size:30px;
 margin-top:8px;
}

button{
 border:none;
 padding:12px;
 border-radius:8px;
 cursor:pointer;
 font-size:15px;
 font-weight:bold;
 color:white;
}

.btn-sale{background:#16864b;width:100%;margin-top:12px}
.btn-expense{background:#dc3545;width:100%;margin-top:12px}
.btn-save{background:#1769aa;width:100%;margin-top:12px}
.delete{background:#dc3545;padding:7px 10px;font-size:12px}

.entry{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 border-bottom:1px solid #eee;
 padding:12px 0;
}

.entry:last-child{border:0}

.entry small{color:#777}
.entry strong{display:block;margin-bottom:5px}

.section-title{
 font-size:17px;
 margin-bottom:14px;
}

.history{
 display:flex;
 gap:8px;
 align-items:center;
}

.history input{flex:1}

.footer{
 text-align:center;
 padding:20px;
 color:#888;
 font-size:12px;
}

@media(max-width:400px){
 .box h2{font-size:19px}
 .header h2{font-size:20px}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
 <h2>🍔 HAMBURGER CAFE</h2>
 <p>AND FAST FOOD</p>
 <p style="margin-top:8px">দৈনিক আয়-ব্যয়ের হিসাব</p>
</div>

<div class="card">
 <div class="date-row">
  <label>📅 হিসাবের তারিখ</label>
  <input type="date" id="date" style="width:auto">
 </div>
</div>

<div class="card">
 <h3 class="section-title">💰 ক্যাশ হিসাব</h3>

 <label>শুরুর ক্যাশ (Opening Cash)</label>
 <input type="number" id="opening" placeholder="শুরুর ক্যাশ লিখুন" min="0">

 <div class="summary">
  <div class="box">
   <small>মোট বিক্রি</small>
   <h2 class="green" id="sales">৳ ০</h2>
  </div>

  <div class="box">
   <small>মোট খরচ</small>
   <h2 class="red" id="expenses">৳ ০</h2>
  </div>
 </div>

 <div class="final">
  <small>আজকের মোট ক্যাশ</small>
  <h1 id="balance">৳ ০</h1>
 </div>
</div>

<div class="card">
 <h3 class="section-title">🟢 নতুন বিক্রি যোগ করুন</h3>
 <label>বিক্রির বিবরণ</label>
 <input id="saleNote" placeholder="যেমন: বার্গার বিক্রি">

 <label>বিক্রির টাকা</label>
 <input type="number" id="saleAmount" placeholder="টাকার পরিমাণ" min="0">

 <button class="btn-sale" onclick="addEntry('sale')">
 + বিক্রি যোগ করুন
 </button>
</div>

<div class="card">
 <h3 class="section-title">🔴 নতুন খরচ যোগ করুন</h3>
 <label>খরচের বিবরণ</label>
 <input id="expenseNote" placeholder="যেমন: বাজার খরচ">

 <label>খরচের টাকা</label>
 <input type="number" id="expenseAmount" placeholder="টাকার পরিমাণ" min="0">

 <button class="btn-expense" onclick="addEntry('expense')">
 + খরচ যোগ করুন
 </button>
</div>

<div class="card">
 <h3 class="section-title">📋 আজকের লেনদেন</h3>
 <div id="entries"></div>
</div>

<div class="card">
 <h3 class="section-title">📆 আগের দিনের হিসাব</h3>
 <div class="history">
  <input type="date" id="historyDate">
  <button class="btn-save" onclick="showHistory()">দেখুন</button>
 </div>
 <div id="historyResult" style="margin-top:15px"></div>
</div>

<div class="footer">
 © Hamburger Cafe & Fast Food<br>
 Daily Cash Management System
</div>

</div>

<script>

let database = JSON.parse(
 localStorage.getItem("cafeDatabase") || "{}"
);

const dateInput = document.getElementById("date");
const openingInput = document.getElementById("opening");

function today(){
 const d = new Date();
 const offset = d.getTimezoneOffset();
 return new Date(d.getTime()-offset*60000)
 .toISOString().slice(0,10);
}

dateInput.value = today();

function getData(date){
 if(!database[date]){
  database[date]={
   opening:null,
   entries:[]
  };
 }
 return database[date];
}

function previousBalance(date){
 const dates = Object.keys(database)
 .filter(d=>d<date)
 .sort()
 .reverse();

 if(!dates.length) return 0;

 let previous = database[dates[0]];
 let sales = previous.entries
  .filter(e=>e.type==="sale")
  .reduce((s,e)=>s+e.amount,0);

 let expenses = previous.entries
  .filter(e=>e.type==="expense")
  .reduce((s,e)=>s+e.amount,0);

 return (previous.opening || 0)+sales-expenses;
}

function save(){
 localStorage.setItem(
  "cafeDatabase",
  JSON.stringify(database)
 );
}

function calculate(){

 const date = dateInput.value;
 if(!date) return;

 const data = getData(date);

 if(data.opening===null){
  data.opening=previousBalance(date);
 }

 openingInput.value=data.opening;

 const sales=data.entries
 .filter(e=>e.type==="sale")
 .reduce((s,e)=>s+e.amount,0);

 const expenses=data.entries
 .filter(e=>e.type==="expense")
 .reduce((s,e)=>s+e.amount,0);

 const balance=data.opening+sales-expenses;

 document.getElementById("sales").innerText=
 "৳ "+sales.toLocaleString("en-IN");

 document.getElementById("expenses").innerText=
 "৳ "+expenses.toLocaleString("en-IN");

 document.getElementById("balance").innerText=
 "৳ "+balance.toLocaleString("en-IN");

 renderEntries();
 save();
}

function addEntry(type){

 const noteInput=document.getElementById(
  type==="sale"?"saleNote":"expenseNote"
 );

 const amountInput=document.getElementById(
  type==="sale"?"saleAmount":"expenseAmount"
 );

 const amount=Number(amountInput.value);
 const note=noteInput.value.trim();

 if(!amountInput.value || amount<=0){
  alert("সঠিক টাকার পরিমাণ লিখুন");
  return;
 }

 const data=getData(dateInput.value);

 data.entries.push({
  id:Date.now(),
  type:type,
  note:note || (type==="sale"?"বিক্রি":"খরচ"),
  amount:amount
 });

 noteInput.value="";
 amountInput.value="";

 calculate();
}

function renderEntries(){

 const data=getData(dateInput.value);
 const box=document.getElementById("entries");

 if(data.entries.length===0){
  box.innerHTML="<p style='color:#888;text-align:center'>আজ কোনো লেনদেন নেই</p>";
  return;
 }

 box.innerHTML=data.entries.map(e=>`
  <div class="entry">
   <div>
    <strong>${escapeHTML(e.note)}</strong>
    <small>${e.type==="sale"?"বিক্রি":"খরচ"}</small>
   </div>
   <div style="text-align:right">
    <strong class="${e.type==="sale"?"green":"red"}">
     ${e.type==="sale"?"+":"-"} ৳${e.amount.toLocaleString("en-IN")}
    </strong>
    <button class="delete" onclick="removeEntry(${e.id})">মুছুন</button>
   </div>
  </div>
 `).join("");
}

function escapeHTML(str){
 return String(str).replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function removeEntry(id){
 if(!confirm("এই লেনদেনটি মুছে ফেলবেন?"))return;

 const data=getData(dateInput.value);
 data.entries=data.entries.filter(e=>e.id!==id);
 calculate();
}

openingInput.addEventListener("change",()=>{
 const amount=Number(openingInput.value);

 if(amount<0){
  alert("নেগেটিভ টাকা দেওয়া যাবে না");
  return;
 }

 getData(dateInput.value).opening=amount;
 calculate();
});

dateInput.addEventListener("change",calculate);

function showHistory(){

 const date=document.getElementById("historyDate").value;

 if(!date){
  alert("তারিখ নির্বাচন করুন");
  return;
 }

 const data=database[date];

 if(!data){
  document.getElementById("historyResult").innerHTML=
  "এই তারিখে কোনো হিসাব পাওয়া যায়নি";
  return;
 }

 const sales=data.entries
 .filter(e=>e.type==="sale")
 .reduce((s,e)=>s+e.amount,0);

 const expenses=data.entries
 .filter(e=>e.type==="expense")
 .reduce((s,e)=>s+e.amount,0);

 const opening=data.opening||0;
 const balance=opening+sales-expenses;

 document.getElementById("historyResult").innerHTML=`
  <p>শুরুর ক্যাশ: ৳${opening.toLocaleString("en-IN")}</p>
  <p style="color:green;margin-top:8px">মোট বিক্রি: ৳${sales.toLocaleString("en-IN")}</p>
  <p style="color:red;margin-top:8px">মোট খরচ: ৳${expenses.toLocaleString("en-IN")}</p>
  <h3 style="margin-top:12px;color:#16864b">
   ক্লোজিং ক্যাশ: ৳${balance.toLocaleString("en-IN")}
  </h3>
 `;
}

calculate();

</script>

</body>
</html>
